id: control-flow-01-fizzbuzz
title: FizzBuzz
topic: control_flow
difficulty: beginner
order: 1
description: |
  ## FizzBuzz

  Write a function `fizzbuzz(n)` that returns a list of strings for the
  numbers 1 through `n` (inclusive), where:

  - multiples of 3 are replaced with `"Fizz"`
  - multiples of 5 are replaced with `"Buzz"`
  - multiples of both 3 and 5 are replaced with `"FizzBuzz"`
  - everything else is the number itself, as a string
function_name: fizzbuzz
starter_code: |
  def fizzbuzz(n):
      """Return the FizzBuzz sequence from 1 to n as a list of strings."""
      # TODO: implement
      raise NotImplementedError
solution: |
  def fizzbuzz(n):
      result = []
      for i in range(1, n + 1):
          if i % 15 == 0:
              result.append("FizzBuzz")
          elif i % 3 == 0:
              result.append("Fizz")
          elif i % 5 == 0:
              result.append("Buzz")
          else:
              result.append(str(i))
      return result
hints:
  - "Loop from 1 to n using range(1, n + 1)."
  - "Check divisibility by 15 first (both 3 and 5), before checking 3 or 5 individually."
  - "Use the modulo operator % to test divisibility: i % 3 == 0."
test_cases:
  - name: n=1
    args: [1]
    expected: ["1"]
  - name: n=5
    args: [5]
    expected: ["1", "2", "Fizz", "4", "Buzz"]
  - name: n=15
    args: [15]
    expected: ["1", "2", "Fizz", "4", "Buzz", "Fizz", "7", "8", "Fizz", "Buzz", "11", "Fizz", "13", "14", "FizzBuzz"]
