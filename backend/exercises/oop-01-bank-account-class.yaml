id: oop-01-bank-account-class
title: Bank Account Class
topic: oop
difficulty: intermediate
order: 1
description: |
  ## Bank Account Class

  Implement a `BankAccount` class with:

  - a constructor `__init__(self, balance)` that sets the starting balance
  - a `deposit(self, amount)` method that adds `amount` to the balance
  - a `withdraw(self, amount)` method that subtracts `amount` from the
    balance **only if** there are sufficient funds (otherwise the balance
    is unchanged)

  Then write a function `run_account_operations(initial_balance, operations)`
  that creates a `BankAccount` with `initial_balance`, applies each
  `(action, amount)` pair in `operations` (where `action` is `"deposit"`
  or `"withdraw"`), and returns the final balance.
function_name: run_account_operations
starter_code: |
  class BankAccount:
      def __init__(self, balance):
          self.balance = balance

      def deposit(self, amount):
