      return account.balance
solution: |
  class BankAccount:
      def __init__(self, balance):
          self.balance = balance

      def deposit(self, amount):
          self.balance += amount

      def withdraw(self, amount):
          if amount <= self.balance:
              self.balance -= amount


  def run_account_operations(initial_balance, operations):
      account = BankAccount(initial_balance)
      for action, amount in operations:
          if action == "deposit":
              account.deposit(amount)
          elif action == "withdraw":
              account.withdraw(amount)
      return account.balance
hints:
  - "deposit just adds to self.balance."
  - "withdraw should check `if amount <= self.balance:` before subtracting -- otherwise leave the balance unchanged."
  - "self.balance persists between method calls because it's stored on the instance."
test_cases:
  - name: deposit then withdraw
    args: [100, [["deposit", 50], ["withdraw", 30]]]
    expected: 120
  - name: overdraw is ignored
    args: [50, [["withdraw", 1000]]]
    expected: 50
  - name: multiple deposits
    args: [0, [["deposit", 10], ["deposit", 20], ["deposit", 5]]]
    expected: 35
