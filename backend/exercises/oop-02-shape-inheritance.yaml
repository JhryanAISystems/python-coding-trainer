solution: |
  import math


  class Shape:
      def area(self):
          raise NotImplementedError


  class Circle(Shape):
      def __init__(self, radius):
          self.radius = radius

      def area(self):
          return math.pi * self.radius ** 2


  class Rectangle(Shape):
      def __init__(self, width, height):
          self.width = width
          self.height = height

      def area(self):
          return self.width * self.height


  def total_area(shapes):
      total = 0
      for spec in shapes:
          if spec["type"] == "circle":
              shape = Circle(spec["radius"])
          else:
              shape = Rectangle(spec["width"], spec["height"])
          total += shape.area()
      return round(total, 2)
hints:
  - "Circle.area() is math.pi * self.radius ** 2 (import math at the top)."
  - "Rectangle.area() is just self.width * self.height."
  - "In total_area, branch on spec['type'] to decide which class to construct, then call .area() on each and sum, rounding at the end."
test_cases:
  - name: single circle
    args: [[{type: circle, radius: 1}]]
    expected: 3.14
  - name: single rectangle
    args: [[{type: rectangle, width: 2, height: 3}]]
    expected: 6.0
  - name: mixed shapes
    args: [[{type: circle, radius: 1}, {type: rectangle, width: 2, height: 3}]]
    expected: 9.14
