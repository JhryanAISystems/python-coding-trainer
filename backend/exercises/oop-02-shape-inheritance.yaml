id: oop-02-shape-inheritance
title: Shape Inheritance
topic: oop
difficulty: advanced
order: 2
description: |
  ## Shape Inheritance

  Implement a base class `Shape` with an `area()` method that raises
  `NotImplementedError`, and two subclasses:

  - `Circle(radius)` whose `area()` returns `math.pi * radius ** 2`
  - `Rectangle(width, height)` whose `area()` returns `width * height`

  Then write a function `total_area(shapes)` that takes a list of shape
  specs (dicts like `{"type": "circle", "radius": 2}` or
  `{"type": "rectangle", "width": 3, "height": 4}`), builds the
  corresponding shape objects, and returns the sum of their areas rounded
  to 2 decimal places.
function_name: total_area
