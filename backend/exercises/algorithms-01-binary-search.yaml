id: algorithms-01-binary-search
title: Binary Search
topic: algorithms
difficulty: intermediate
order: 1
description: |
  ## Binary Search

  Write a function `binary_search(sorted_list, target)` that returns the
  index of `target` in `sorted_list` (which is sorted in ascending order),
  or `-1` if it isn't present. Implement it with the classic O(log n)
  binary search algorithm -- don't just use `.index()` or a linear scan.
function_name: binary_search
starter_code: |
  def binary_search(sorted_list, target):
      """Return the index of target in sorted_list using binary search, or -1."""
      # TODO: implement
      raise NotImplementedError
solution: |
  def binary_search(sorted_list, target):
      low, high = 0, len(sorted_list) - 1
      while low <= high:
          mid = (low + high) // 2
          if sorted_list[mid] == target:
              return mid
          elif sorted_list[mid] < target:
              low = mid + 1
          else:
              high = mid - 1
      return -1
hints:
  - "Keep two pointers, low and high, spanning the current search range."
  - "Check the middle element: if it's too small, search the right half; if too large, search the left half."
  - "Stop and return -1 once low > high -- the target isn't in the list."
test_cases:
  - name: found in middle
    args: [[1, 3, 5, 7, 9], 5]
    expected: 2
  - name: not found
    args: [[1, 3, 5, 7, 9], 4]
    expected: -1
  - name: empty list
    args: [[], 1]
    expected: -1
  - name: first element
    args: [[2, 4, 6], 2]
    expected: 0
